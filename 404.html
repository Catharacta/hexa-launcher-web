<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Hexa Launcher</title>
  <script>
    (function (l) {
      if (l.search[1] === '/') {
        var decoded = l.search.slice(1).split('&').map(function (s) {
          return s.replace(/~and~/g, '&')
        }).join('?');
        window.history.replaceState(null, null,
          l.pathname.slice(0, -1) + decoded + l.hash
        );
      }
    }(window.location))
  </script>
  <script>
      // SPA redirect for GitHub Pages
      (function (l) {
        if (l.search) return;
        var path = l.pathname;
        var basePath = '/hexa-launcher-web';
        if (path !== basePath && path !== basePath + '/' && path !== basePath + '/index.html') {
          var segment = path.replace(basePath, '');
          window.location.replace(basePath + '/?' + segment);
        }
      }(window.location))
  </script>
</head>

<body>
  <p>Redirecting...</p>
</body>

</html>
